[project]
name = "dock-server"
version = "0.1.0"
description = "Dock MCP server: tools for Alexa+ (or the simulated Alexa+ web app), plus WebSockets to the desktop agent and phone."
requires-python = ">=3.12"
dependencies = [
    "boto3[crt]>=1.43.114",
    "google-auth-oauthlib>=1.5.0",
    "mcp==2.3.0",
    "qrcode>=8.2",
    "uvicorn",
    "websockets",
]
