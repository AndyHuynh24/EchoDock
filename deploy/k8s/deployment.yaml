apiVersion: apps/v1
kind: Deployment
metadata:
  name: dock-server
  labels:
    app.kubernetes.io/name: dock-server
spec:
  # Exactly ONE replica, on purpose. The server is stateful:
  #  - The WebSocket hub (dock_server/hub.py) keeps the desktop agent's socket, the
  #    phones' sockets and the pending agent requests in memory. With 2 pods, the agent
  #    would connect to pod A while an MCP/voice request lands on pod B, which would
  #    answer "the computer is offline"; phone pushes would only reach some phones.
  #  - Focus timers and other session state are in memory too.
  #  - Saved data is SQLite + JSON files on a ReadWriteOnce volume.
  # Scaling out would need a shared message bus (e.g. Redis pub/sub) and a database.
  replicas: 1
  # Recreate (not RollingUpdate): a rolling update briefly runs two pods, and the
  # agent could stay attached to the old one. Recreate stops the old pod first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dock-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dock-server
    spec:
      automountServiceAccountToken: false  # the server never talks to the Kubernetes API
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001  # lets the non-root user write to the data volume
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 15
      containers:
        - name: server
          image: dock-server  # tag set in kustomization.yaml (images:)
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: dock-server-config
            - secretRef:
                name: dock-server-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          # Startup can take a few seconds (boto3, MCP tools); allow up to 60 s.
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /app/.data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dock-server-data
        - name: tmp
          emptyDir: {}
