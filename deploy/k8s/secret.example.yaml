# TEMPLATE ONLY. Do not put real values in this file.
#
# Easiest: let the Makefile create the Secret for you (reads DOCK_TOKEN from your
# environment or from .dock-token, and optionally your current AWS login):
#     make secret            # token only
#     make secret AWS=1      # token + temporary AWS credentials for Bedrock
#
# Or copy this file to secret.yaml (git-ignored), fill it in, and apply it:
#     cp deploy/k8s/secret.example.yaml deploy/k8s/secret.yaml
#     kubectl apply -f deploy/k8s/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: dock-server-secrets
  namespace: echodock
type: Opaque
stringData:
  # Required. Must match the DOCK_TOKEN the desktop agent and phone use.
  # Make one with:  openssl rand -hex 16
  DOCK_TOKEN: "REPLACE_ME"
  # Optional: AWS credentials for Bedrock. Without them the server still runs,
  # but voice answers, app help and message ranking fail.
  # AWS_ACCESS_KEY_ID: "REPLACE_ME"
  # AWS_SECRET_ACCESS_KEY: "REPLACE_ME"
  # AWS_SESSION_TOKEN: "REPLACE_ME"   # only for temporary credentials
